name: deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# Let a running deploy finish rather than cancelling it part-way.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  PAGES_PROJECT: helenkowalewska

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1

      # main is production. Any other branch becomes a Pages preview at its branch alias, which the
      # build needs as its baseURL so links that compare against it still work. The preview
      # environment also adds noindex in _partials/head.html.
      - name: Choose build settings
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = main ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            alias=$(printf %s "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' \
              | sed -E 's/[^a-z0-9]+/-/g' | cut -c1-28 | sed -E 's/^-+//; s/-+$//')
            echo "args=--environment preview --baseURL https://$alias.$PAGES_PROJECT.pages.dev/" >> "$GITHUB_OUTPUT"
          fi

      # Uses the image pinned in compose.yaml, so CI builds with the same Hugo as `poe build`. Run
      # as the runner's user so public/ is writable, with the cache moved off the image's root-owned
      # /cache for the same reason.
      - name: Build
        run: >-
          docker compose run --rm -T
          --user "$(id -u):$(id -g)" -e HUGO_CACHEDIR=/tmp/hugo-cache
          hugo build --gc --minify --cleanDestinationDir ${{ steps.target.outputs.args }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy public --project-name="$PAGES_PROJECT" --branch="$GITHUB_REF_NAME"
