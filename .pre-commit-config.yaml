# Install once with `pre-commit install`. Run everything with `pre-commit run --all-files`.

# static/ and the page bundles' files are served exactly as they are.
exclude: ^(public|resources|static)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # Page bundles carry PDFs, and the portrait and fonts are binary. Cloudflare Pages caps a
        # file at 25 MB.
        exclude: ^(content|assets)/
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
        # A final newline in a shortcode leaks into the page. See .editorconfig.
        exclude: ^layouts/_shortcodes/
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
