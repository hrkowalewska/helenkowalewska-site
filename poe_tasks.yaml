tasks:
  up:
    help: Run the dev site with drafts in Docker at http://localhost:1313, Ctrl-C to stop
    cmd: docker compose up
  down:
    help: Remove the dev site's container and network
    cmd: docker compose down
  build:
    help: Build the production site into public/
    cmd: docker compose run --rm hugo build --gc --minify --cleanDestinationDir
  hugo:
    help: Run any Hugo command in the container, e.g. poe hugo new content media/my-item/index.md
    cmd: docker compose run --rm hugo
  clean:
    help: Remove build output and the image-processing cache
    cmd: rm -rf public resources
